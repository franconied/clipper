<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CLIPPER — Solo Streaming</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0a0a0a; --surface: #111111; --border: #222222; --accent: #e8ff3d; --accent2: #ff4d6d; --text: #f0f0f0; --muted: #555; --green: #3dffa0; --orange: #ff8c42; --blue: #42a8ff; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Syne', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  .noise { position: fixed; inset: 0; pointer-events: none; z-index: 0; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E"); opacity: 0.4; }
  .wrap { position: relative; z-index: 1; max-width: 860px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 3rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
  .logo { display: flex; align-items: center; gap: 12px; }
  .logo-mark { width: 36px; height: 36px; background: var(--accent); border-radius: 6px; display: flex; align-items: center; justify-content: center; }
  .logo-mark svg { width: 20px; height: 20px; }
  .logo-text { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
  .logo-text span { color: var(--accent); }
  .badge { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted); border: 1px solid var(--border); padding: 4px 10px; border-radius: 4px; }
  .step-label { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--accent); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 10px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; margin-bottom: 1.25rem; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; font-family: 'JetBrains Mono', monospace; }
  input[type="text"], textarea, select { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: 13px; padding: 10px 14px; outline: none; transition: border-color 0.2s; }
  textarea { resize: vertical; min-height: 130px; line-height: 1.5; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  @media (max-width: 600px) { .grid-2 { grid-template-columns: 1fr; } }
  .btn-main { width: 100%; padding: 16px; background: var(--accent); color: #000; font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 800; border: none; border-radius: 10px; cursor: pointer; letter-spacing: 0.02em; transition: transform 0.15s, opacity 0.15s; margin-top: 0.5rem; }
  .btn-main:hover { transform: translateY(-1px); opacity: 0.92; }
  .btn-main:disabled { opacity: 0.4; cursor: not-allowed; }
  #loading { display: none; text-align: center; padding: 3rem 0; }
  .spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--muted); }
  #error-box { display: none; background: #1a0a0a; border: 1px solid #4d1a1a; border-radius: 10px; padding: 1rem 1.25rem; margin-bottom: 1rem; color: var(--accent2); font-size: 14px; font-family: 'JetBrains Mono', monospace; }
  #results { display: none; }
  .results-title { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
  .results-meta { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--muted); margin-bottom: 1.5rem; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 1.5rem; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 1rem; text-align: center; }
  .stat-n { font-size: 32px; font-weight: 800; line-height: 1; }
  .stat-n.accent { color: var(--accent); }
  .stat-n.ig { color: #e1306c; }
  .stat-n.tk { color: #69c9d0; }
  .stat-label { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted); margin-top: 4px; }
  .clips-list { display: flex; flex-direction: column; gap: 12px; }
  .clip-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem; }
  .clip-top { display: flex; align-items: flex-start; gap: 12px; }
  .clip-num { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted); min-width: 24px; }
  .clip-body { flex: 1; }
  .clip-title { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
  .clip-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .clip-time { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--muted); }
  .tag { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 20px; text-transform: uppercase; }
  .tag-viral { background: #2d0a0a; color: var(--accent2); border: 1px solid #4d1a1a; }
  .plat { font-size: 10px; padding: 2px 7px; border-radius: 4px; font-family: 'JetBrains Mono', monospace; }
  .plat-ig { background: #2d0a18; color: #e1306c; border: 1px solid #4d1a30; }
  .plat-tk { background: #001a1a; color: #69c9d0; border: 1px solid #003333; }
  .clip-reason { font-size: 13px; color: #888; line-height: 1.5; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }
  .copy-btn { font-family: 'JetBrains Mono', monospace; font-size: 11px; padding: 4px 10px; background: transparent; border: 1px solid var(--border); border-radius: 6px; color: var(--muted); cursor: pointer; transition: 0.2s; }
  .copy-btn:hover { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>
<div class="noise"></div>
<div class="wrap">
  <header>
    <div class="logo">
      <div class="logo-mark"><svg viewBox="0 0 20 20" fill="none"><path d="M4 4l8 6-8 6V4z" fill="#000"/><rect x="14" y="4" width="2" height="12" rx="1" fill="#000"/></svg></div>
      <div class="logo-text">CLIP<span>PER</span></div>
    </div>
    <div class="badge">Solo Streaming</div>
  </header>

  <div class="card">
    <div class="step-label">Configuración</div>
    <div style="margin-bottom:1rem;">
      <label>URL DEL PROGRAMA</label>
      <input type="text" id="yt-url" placeholder="https://www.youtube.com/watch?v=..." />
    </div>
    <div class="grid-2" style="margin-bottom:1rem;">
      <div>
        <label>PROGRAMA</label>
        <select id="program-select" onchange="filterCharacters()">
          <option value="">Seleccionar programa...</option>
          <option value="noticias">Solo Noticias</option>
          <option value="musica">Solo Música</option>
          <option value="convos">Solo con Vos</option>
          <option value="magazine">Solo Magazine</option>
          <option value="porhoy1">Solo Por Hoy</option>
          <option value="porhoy2">Solo con Nicki</option>
          <option value="futbol">Solo Fútbol</option>
        </select>
      </div>
      <div>
        <label>PERSONAJE FOCO</label>
        <select id="character-select"><option value="todos">Todos</option></select>
      </div>
    </div>
    <div>
      <label>TRANSCRIPCIÓN</label>
      <textarea id="transcript" placeholder="Pegá la transcripción completa de YouTube acá..."></textarea>
    </div>
    <button class="btn-main" onclick="analyze()">⚡ ANALIZAR CLIPS</button>
  </div>

  <div id="loading"><div class="spinner"></div><div class="loading-text" id="loading-msg">Iniciando sistema...</div></div>
  <div id="error-box"></div>
  
  <div id="results">
    <div class="results-title" id="res-title"></div>
    <div class="results-meta" id="res-meta"></div>
    <div class="stats">
      <div class="stat"><div class="stat-n accent" id="stat-total">0</div><div class="stat-label">CLIPS</div></div>
      <div class="stat"><div class="stat-n ig" id="stat-ig">0</div><div class="stat-label">REELS</div></div>
      <div class="stat"><div class="stat-n tk" id="stat-tk">0</div><div class="stat-label">TIKTOK</div></div>
    </div>
    <div class="clips-list" id="clips-list"></div>
  </div>
</div>

<script>
const GEMINI_KEY = "AIzaSyBnrzYF9pjMkWth6SVYBbWth6crBwdezpw";

const PROGRAMS = {
  noticias: { label: "Solo Noticias", chars: ["Eleonora Perez Caressi","Santiago Do Rego"] },
  musica:   { label: "Solo Música",   chars: ["Juani Martinez"] },
  convos:   { label: "Solo con Vos",  chars: ["Rama","Abru","Tery Langer","Martu","Barbie"] },
  magazine: { label: "Solo Magazine", chars: ["Sofia Macaggi","GuiGui","Gonzalo Sorbo"] },
  porhoy1:  { label: "Solo Por Hoy",  chars: ["Lio Ferro","Luchi","Julian Serrano","Martin Salwe"] },
  porhoy2:  { label: "Solo con Nicki", chars: ["Nicole Neumann","Gege Neumann","Justi Scasso","Juan Otero"] },
  futbol:   { label: "Solo Fútbol",   chars: ["Rama","Agos Scalisse","Milton Re","Bichi Fuertes","Pichi Erber"] }
};

let allClips = [];

function filterCharacters() {
  const prog = document.getElementById('program-select').value;
  const sel = document.getElementById('character-select');
  sel.innerHTML = '<option value="todos">Todos</option>';
  if (prog && PROGRAMS[prog]) {
    PROGRAMS[prog].chars.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c; opt.textContent = c;
      sel.appendChild(opt);
    });
  }
}

function showError(msg) {
  const el = document.getElementById('error-box');
  el.textContent = '⚠ ' + msg;
  el.style.display = 'block';
}

async function analyze() {
  document.getElementById('error-box').style.display = 'none';
  const transcript = document.getElementById('transcript').value.trim();
  if (!transcript) { showError('Pegá la transcripción antes de analizar.'); return; }

  const program = document.getElementById('program-select').value;
  const character = document.getElementById('character-select').value;
  const progLabel = program ? PROGRAMS[program].label : 'Programa';

  const fullPrompt = `Sos un experto en contenido viral. Analizá esta transcripción de "Solo Streaming".
Detectá entre 6 y 14 clips (15-90 seg) ideales para Reels/TikTok.
Foco en: ${character}. Programa: ${progLabel}.
Regla ABSOLUTA: Responde UNICAMENTE con un JSON válido. Cero texto introductorio. Formato exacto:
{"videoTitle":"titulo","clips":[{"title":"nombre","startTime":"MM:SS","endTime":"MM:SS","category":"viral","score":90,"platform":["Instagram","TikTok"],"reason":"explicación"}]}

TRANSCRIPCION:
${transcript}`;

  document.querySelector('.btn-main').disabled = true;
  document.getElementById('loading').style.display = 'block';
  document.getElementById('results').style.display = 'none';
  const loadingMsg = document.getElementById('loading-msg');

  try {
    // PASO 1: MODO DIAGNÓSTICO (Listar modelos disponibles en la API Key)
    loadingMsg.textContent = "Escaneando modelos permitidos en tu API Key...";
    const listResp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${GEMINI_KEY}`);
    
    if (!listResp.ok) {
       const err = await listResp.json();
       throw new Error("API Key inválida o rechazada por Google. Detalle: " + (err.error?.message || "Desconocido"));
    }

    const listData = await listResp.json();
    
    // PASO 2: Encontrar el mejor modelo disponible que permita generar contenido
    const validModels = listData.models.filter(m => 
      m.supportedGenerationMethods?.includes("generateContent") && 
      m.name.includes("gemini")
    );

    if (validModels.length === 0) {
      throw new Error("Tu API Key está activa pero no tiene permisos para usar modelos de generación de texto Gemini.");
    }

    // Buscamos priorizar cualquier versión "flash", si no hay, agarramos el primero de la lista.
    let selectedModel = validModels.find(m => m.name.includes("flash") && !m.name.includes("tuning"))?.name;
    if (!selectedModel) {
      selectedModel = validModels[0].name; 
    }

    loadingMsg.textContent = `Conectando con modelo autorizado: ${selectedModel.replace('models/', '')}...`;
    
    // PASO 3: Llamar al endpoint correcto dinámicamente
    const endpoint = `https://generativelanguage.googleapis.com/v1beta/${selectedModel}:generateContent?key=${GEMINI_KEY}`;
    
    const resp = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{ parts: [{ text: fullPrompt }] }],
        generationConfig: { temperature: 0.7 }
      })
    });

    if (!resp.ok) {
      const errData = await resp.json();
      throw new Error(errData?.error?.message || "Error interno al solicitar el análisis.");
    }

    const data = await resp.json();
    let rawContent = data?.candidates?.[0]?.content?.parts?.[0]?.text;
    
    if (!rawContent) throw new Error("La IA analizó el texto pero no devolvió resultados.");

    loadingMsg.textContent = "Procesando clips...";

    // Extractor seguro de JSON
    let cleanJson = rawContent;
    const jsonMatch = rawContent.match(/\{[\s\S]*\}/);
    if (jsonMatch) cleanJson = jsonMatch[0];
    
    const result = JSON.parse(cleanJson);
    renderResults(result, progLabel, character);

  } catch(e) {
    console.error("Error completo de sistema:", e);
    showError(e.message);
  } finally {
    document.querySelector('.btn-main').disabled = false;
    document.getElementById('loading').style.display = 'none';
  }
}

function renderResults(result, prog, char) {
  allClips = result.clips || [];
  const ig = allClips.filter(c => c.platform?.includes('Instagram')).length;
  const tk = allClips.filter(c => c.platform?.includes('TikTok')).length;

  document.getElementById('res-title').textContent = result.videoTitle || 'Análisis Completo';
  document.getElementById('res-meta').textContent = `${prog} · Foco: ${char}`;
  document.getElementById('stat-total').textContent = allClips.length;
  document.getElementById('stat-ig').textContent = ig;
  document.getElementById('stat-tk').textContent = tk;

  const list = document.getElementById('clips-list');
  list.innerHTML = '';

  allClips.forEach((clip, i) => {
    const card = document.createElement('div');
    card.className = 'clip-card';
    card.innerHTML = `
      <div class="clip-top">
        <div class="clip-num">#${i+1}</div>
        <div class="clip-body">
          <div class="clip-title">${clip.title}</div>
          <div class="clip-row">
            <span class="clip-time">${clip.startTime} - ${clip.endTime}</span>
            <span class="tag tag-viral">${clip.category}</span>
            <button class="copy-btn" onclick="copyClip(this, ${i})">Copiar info</button>
          </div>
          <div class="clip-reason">${clip.reason}</div>
        </div>
      </div>
    `;
    list.appendChild(card);
  });
  document.getElementById('results').style.display = 'block';
  document.getElementById('results').scrollIntoView({ behavior:'smooth' });
}

function copyClip(btn, i) {
  const c = allClips[i];
  const text = `CLIP: ${c.title}\n⏱ ${c.startTime} a ${c.endTime}\n💡 ${c.reason}`;
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✓ Copiado';
    setTimeout(() => btn.textContent = 'Copiar info', 2000);
  });
}
</script>
</body>
</html>
